{% extends "base.html" %}
{% block title %}Tasks — VibeBridge Admin{% endblock %}
{% block content %}
<div class="card">
  <h2>📋 Task Channels</h2>
  <table>
    <thead><tr><th>Redis Channel</th><th>Type</th></tr></thead>
    <tbody>
      {% for t in tasks %}
      <tr><td>{{ t.channel }}</td><td>{{ t.type }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
