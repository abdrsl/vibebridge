<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MyCompany Admin{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
    .container { max-width:1200px; margin:0 auto; padding:20px; }
    header { background:var(--card); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #334155; }
    header h1 { font-size:1.25rem; color:var(--accent); }
    nav { display:flex; gap:16px; }
    nav a { color:var(--text); text-decoration:none; padding:6px 12px; border-radius:6px; font-size:.9rem; }
    nav a:hover, nav a.active { background:#334155; }
    .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid #334155; }
    .card h2 { font-size:1.1rem; margin-bottom:12px; color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
    .stat { text-align:center; }
    .stat .value { font-size:2rem; font-weight:700; }
    .stat .label { font-size:.85rem; color:#94a3b8; }
    .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #334155; }
    th { color:#94a3b8; font-weight:500; }
    tr:hover { background:#253045; }
    button { background:var(--accent); color:#0f172a; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600; }
    button:hover { opacity:.9; }
    .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:.75rem; font-weight:600; }
    .badge-ok { background:rgba(34,197,94,.2); color:var(--ok); }
    .badge-err { background:rgba(239,68,68,.2); color:var(--err); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>🏢 MyCompany Admin</h1>
    <nav>
      <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">Dashboard</a>
      <a href="/admin/bots" class="{% if request.url.path == '/admin/bots' %}active{% endif %}">Bots</a>
      <a href="/admin/agents" class="{% if request.url.path == '/admin/agents' %}active{% endif %}">Agents</a>
      <a href="/admin/keys" class="{% if request.url.path == '/admin/keys' %}active{% endif %}">Keys</a>
      <a href="/admin/tasks" class="{% if request.url.path == '/admin/tasks' %}active{% endif %}">Tasks</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
